<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            background-image: url("hamster.jfif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: linear-gradient(135deg, rgba(165, 203, 250, 0.9), rgba(244, 184, 228, 0.9), rgba(168, 240, 204, 0.9));
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 280px;
            border: 4px solid #ffd1dc; /* Soft pastel pink border */
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #f0f8ff;
            color: #333333;
            font-size: 26px;
            font-weight: bold;
            text-align: right;
            padding: 0 15px;
            box-sizing: border-box;
            border: 2px solid #b0e0e6;
            border-radius: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            pointer-events: none;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f4f4f4;
            color: #444444;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #e2e8f0;
            transform: scale(1.02);
        }
        /* Rainbow/Pastel themed operators */
        .operator {
            background-color: #ffd1dc; /* Pastel Pink */
            color: #d946ef;
        }
        .operator:hover {
            background-color: #fbcfe8;
        }
        .equals {
            background-color: #bae6fd; /* Pastel Sky Blue */
            color: #0284c7;
        }
        .equals:hover {
            background-color: #7dd3fc;
        }
        .clear {
            background-color: #fde68a; /* Pastel Yellow */
            color: #d97706;
        }
        .clear:hover {
            background-color: #fde047;
        }
    </style>
</head>
<body>

<div class="calculator">
    <audio id="equalsSound" src="equal.m4a"></audio>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons-grid">
        <!-- Row 1 -->
        <button class="clear" onclick="clearCalculator()">C</button>
        <button class="clear" onclick="clearEntry()">CE</button>
        <button class="operator" onclick="setOp('/')">÷</button>
        <button class="operator" onclick="setOp('*')">×</button>

        <!-- Row 2 -->
        <button onclick="appendInput('7')">7</button>
        <button onclick="appendInput('8')">8</button>
        <button onclick="appendInput('9')">9</button>
        <button class="operator" onclick="setOp('-')">-</button>

        <!-- Row 3 -->
        <button onclick="appendInput('4')">4</button>
        <button onclick="appendInput('5')">5</button>
        <button onclick="appendInput('6')">6</button>
        <button class="operator" onclick="setOp('+')">+</button>

        <!-- Row 4 -->
        <button onclick="appendInput('1')">1</button>
        <button onclick="appendInput('2')">2</button>
        <button onclick="appendInput('3')">3</button>
        <button class="equals" onclick="calculateResult()" style="grid-row: span 2; height: 100%;">=</button>

        <!-- Row 5 -->
        <button onclick="toggleSign()">+/-</button>
        <button onclick="appendInput('0')">0</button>
        <button onclick="appendInput('.')">.</button>
    </div>
</div>

<script>
    let currentInput = "0";
    let firstNum = null;
    let operation = null;
    let resetScreen = false;

    const display = document.getElementById("display");

    function updateDisplay() {
        display.value = currentInput;
    }

    function appendInput(val) {
        if (resetScreen) {
            currentInput = val === "." ? "0." : val;
            resetScreen = false;
        } else {
            if (val === ".") {
                if (!currentInput.includes(".")) {
                    currentInput += ".";
                }
                updateDisplay();
                return;
            }

            let digitCount = currentInput.replace(/[^0-9]/g, "").length;

            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                if (digitCount < 13) {
                    currentInput += val;
                }
            }
        }
        updateDisplay();
    }

    async function setOp(nextOp) {
        if (firstNum !== null && operation !== null && !resetScreen) {
            await executeBackendCalculation();
        } else {
            firstNum = currentInput;
        }

        operation = nextOp;
        resetScreen = true;
    }

    function toggleSign() {
        if (currentInput === "0") return;

        if (currentInput.startsWith("-")) {
            currentInput = currentInput.substring(1);
        } else {
            currentInput = "-" + currentInput;
        }
        updateDisplay();
    }

    async function executeBackendCalculation() {
        if (firstNum === null || operation === null) return;

        const num1 = firstNum;
        const num2 = currentInput;

        let opParam = operation;
        if (operation === '*') opParam = 'multiply';
        if (operation === '/') opParam = 'divide';
        if (operation === '+') opParam = 'add';
        if (operation === '-') opParam = 'subtract';

        try {
            const response = await fetch(`/calculate?num1=${num1}&num2=${num2}&operation=${opParam}`);
            let result = await response.text();

            if (result.length > 13) {
                result = result.substring(0, 13);
            }

            currentInput = result;
            firstNum = result;
            updateDisplay();
        } catch (error) {
            currentInput = "Error";
            firstNum = null;
            operation = null;
            updateDisplay();
        }
    }

    async function calculateResult() {
        if (firstNum === null || operation === null) return;

        const sound = document.getElementById("equalsSound");
        sound.currentTime = 0;
        sound.play().catch(error => {
            console.log("Audio play blocked or failed:", error);
        });

        await executeBackendCalculation();

        firstNum = null;
        operation = null;
        resetScreen = true;
    }

    function clearCalculator() {
        currentInput = "0";
        firstNum = null;
        operation = null;
        resetScreen = false;
        updateDisplay();
    }

    function clearEntry() {
        if (resetScreen) {
            resetScreen = false;
        }
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === "-") {
                currentInput = "0";
            }
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }
</script>

</body>
</html>
