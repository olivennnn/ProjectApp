<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        #unicorn-video {
            position: fixed;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.85;
            box-shadow: 0 0 25px rgba(255, 182, 193, 0.8);
            animation: floatBubble 12s infinite alternate ease-in-out;
        }

        @keyframes floatBubble {
            0% { top: 5%; left: 10%; transform: scale(1); }
            25% { top: 30%; left: 70%; transform: scale(1.1); }
            50% { top: 75%; left: 80%; transform: scale(0.95); }
            75% { top: 60%; left: 20%; transform: scale(1.15); }
            100% { top: 15%; left: 15%; transform: scale(1); }
        }

        #popup-67 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            z-index: 10000;
            display: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #welcome-overlay h1 {
            color: #d946ef;
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .proceed-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #ffd1dc;
            color: #d946ef;
            border: 2px solid #fbcfe8;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .proceed-btn:hover {
            background-color: #fbcfe8;
            transform: scale(1.05);
        }

        .calculator {
            background: linear-gradient(135deg, rgba(165, 203, 250, 0.9), rgba(244, 184, 228, 0.9), rgba(168, 240, 204, 0.9));
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 280px;
            border: 4px solid #ffd1dc;
            z-index: 10;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #f0f8ff;
            color: #333333;
            font-size: 26px;
            font-weight: bold;
            text-align: right;
            padding: 0 15px;
            box-sizing: border-box;
            border: 2px solid #b0e0e6;
            border-radius: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            pointer-events: none;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f4f4f4;
            color: #444444;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #e2e8f0;
            transform: scale(1.02);
        }
        .operator {
            background-color: #ffd1dc;
            color: #d946ef;
        }
        .operator:hover {
            background-color: #fbcfe8;
        }
        .equals {
            background-color: #bae6fd;
            color: #0284c7;
        }
        .equals:hover {
            background-color: #7dd3fc;
        }
        .clear {
            background-color: #fde68a;
            color: #d97706;
        }
        .clear:hover {
            background-color: #fde047;
        }
    </style>
</head>
<body>

<video id="bg-video" loop src="BG.mp4"></video>
<video id="unicorn-video" loop src="Unicorn.mp4"></video>

<video id="popup-67" src="67.mp4" controls></video>

<audio id="sound-0" src="0.mp3"></audio>
<audio id="sound-1" src="1.mp3"></audio>
<audio id="sound-2" src="2.mp3"></audio>
<audio id="sound-3" src="3.mp3"></audio>
<audio id="sound-4" src="4.mp3"></audio>
<audio id="sound-5" src="5.mp3"></audio>
<audio id="sound-6" src="6.mp3"></audio>
<audio id="sound-7" src="7.mp3"></audio>
<audio id="sound-8" src="8.mp3"></audio>
<audio id="sound-9" src="9.mp3"></audio>
<audio id="sound-dot" src="Dot.mp3"></audio>

<audio id="sound-c" src="C.mp3"></audio>
<audio id="sound-ce" src="CE.mp3"></audio>

<audio id="sound-add" src="Add.mp3"></audio>
<audio id="sound-minus" src="Minus.mp3"></audio>
<audio id="sound-times" src="times.mp3"></audio>
<audio id="sound-divide" src="Divide.mp3"></audio>

<audio id="sound-equals" src="equal.m4a"></audio>
<audio id="errorSound" src="error1.mp3"></audio>
<audio id="sound-greeting" src="Greetings.mp3"></audio>

<div id="welcome-overlay">
    <h1>Welcome to the Calculator!</h1>
    <button class="proceed-btn" onclick="startCalculator()">Proceed to Calculator</button>
</div>

<div class="calculator">
    <input type="text" id="display" value="0" aria-label="Calculator display" readonly>

    <div class="buttons-grid">

        <button class="clear" onclick="clearCalculator()">C</button>
        <button class="clear" onclick="clearEntry()">CE</button>
        <button class="operator" onclick="setOp('/')">÷</button>
        <button class="operator" onclick="setOp('*')">×</button>

        <button onclick="appendInput('7')">7</button>
        <button onclick="appendInput('8')">8</button>
        <button onclick="appendInput('9')">9</button>
        <button class="operator" onclick="setOp('-')">-</button>

        <button onclick="appendInput('4')">4</button>
        <button onclick="appendInput('5')">5</button>
        <button onclick="appendInput('6')">6</button>
        <button class="operator" onclick="setOp('+')">+</button>

        <button onclick="appendInput('1')">1</button>
        <button onclick="appendInput('2')">2</button>
        <button onclick="appendInput('3')">3</button>
        <button class="equals" onclick="calculateResult()" style="grid-row: span 2; height: 100%;">=</button>

        <button onclick="toggleSign()">+/-</button>
        <button onclick="appendInput('0')">0</button>
        <button onclick="appendInput('.')">.</button>
    </div>
</div>

<script>
    let currentInput = "0";
    let firstNum = null;
    let operation = null;
    let resetScreen = false;
    let lastDigitClick = null;

    const display = document.getElementById("display");

    function playAudio(elementId) {
        if (elementId !== 'sound-equals' && elementId !== 'errorSound') {
            const eqSound = document.getElementById("sound-equals");
            const errSound = document.getElementById("errorSound");
            if (eqSound) { eqSound.pause(); eqSound.currentTime = 0; }
            if (errSound) { errSound.pause(); errSound.currentTime = 0; }
        }

        const sound = document.getElementById(elementId);
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Audio blocked:", e));
        }
    }

    function startCalculator() {
        const overlay = document.getElementById("welcome-overlay");
        overlay.style.opacity = "0";
        setTimeout(() => overlay.style.display = "none", 500);

        document.getElementById("bg-video").play().catch(e => console.log(e));
        document.getElementById("unicorn-video").play().catch(e => console.log(e));

        playAudio("sound-greeting");
    }

    function updateDisplay() {
        display.value = currentInput;
    }

    function appendInput(val) {
        if (val === '7' && lastDigitClick === '6') {
            const popupVideo = document.getElementById("popup-67");
            popupVideo.style.display = "block";
            popupVideo.currentTime = 0;
            popupVideo.play().catch(e => console.log(e));
            popupOpenTime = Date.now();

            popupVideo.onended = () => {
                popupVideo.style.display = "none";
                popupOpenTime = 0;
            };
        }

        document.addEventListener("click", () => {
            const popupVideo = document.getElementById("popup-67");
            if (popupVideo.style.display === "block" && Date.now() - popupOpenTime > 300) {
                popupVideo.pause();
                popupVideo.style.display = "none";
                popupOpenTime = 0;
            }
        });

        lastDigitClick = val;

        if (val === ".") {
            playAudio("sound-dot");
        } else if (!isNaN(val)) {
            playAudio("sound-" + val);
        }

        if (resetScreen) {
            currentInput = val === "." ? "0." : val;
            resetScreen = false;
        } else {
            if (val === ".") {
                if (!currentInput.includes(".")) {
                    currentInput += ".";
                }
                updateDisplay();
                return;
            }

            let digitCount = currentInput.replace(/[^0-9]/g, "").length;

            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                if (digitCount < 13) {
                    currentInput += val;
                }
            }
        }
        updateDisplay();
    }

    async function setOp(nextOp) {
        lastDigitClick = null;

        if (nextOp === '+') playAudio("sound-add");
        else if (nextOp === '-') playAudio("sound-minus");
        else if (nextOp === '*') playAudio("sound-times");
        else if (nextOp === '/') playAudio("sound-divide");

        if (firstNum !== null && operation !== null && !resetScreen) {
            await executeBackendCalculation();
        } else {
            firstNum = currentInput;
        }

        operation = nextOp;
        resetScreen = true;
    }

    function toggleSign() {
        lastDigitClick = null;
        if (currentInput === "0") return;

        if (currentInput.startsWith("-")) {
            currentInput = currentInput.substring(1);
        } else {
            currentInput = "-" + currentInput;
        }
        updateDisplay();
    }

    async function executeBackendCalculation() {
        if (firstNum === null || operation === null) return false;

        const num1 = firstNum;
        const num2 = currentInput;

        let opParam = operation;
        if (operation === '*') opParam = 'multiply';
        if (operation === '/') opParam = 'divide';
        if (operation === '+') opParam = 'add';
        if (operation === '-') opParam = 'subtract';

        try {
            const response = await fetch(`/calculate?num1=${num1}&num2=${num2}&operation=${opParam}`);
            let result = await response.text();

            if (result === "Error" || result === "Invalid") {
                playAudio("errorSound");
                currentInput = result;
                firstNum = null;
                operation = null;
                updateDisplay();
                return true;
            }

            if (result.length > 13) {
                result = result.substring(0, 13);
            }

            currentInput = result;
            firstNum = result;
            updateDisplay();
            return false; // No error
        } catch (error) {
            currentInput = "Error";
            firstNum = null;
            operation = null;
            updateDisplay();
            playAudio("errorSound");
            return true;
        }
    }

    async function calculateResult() {
        lastDigitClick = null;
        if (firstNum === null || operation === null) return;

        let hasError = await executeBackendCalculation();

        if (!hasError) {
            playAudio("sound-equals");
        }

        firstNum = null;
        operation = null;
        resetScreen = true;
    }

    function clearCalculator() {
        lastDigitClick = null;
        playAudio("sound-c");
        currentInput = "0";
        firstNum = null;
        operation = null;
        resetScreen = false;
        updateDisplay();
    }

    function clearEntry() {
        lastDigitClick = null;
        playAudio("sound-ce");
        if (resetScreen) {
            resetScreen = false;
        }
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === "-") {
                currentInput = "0";
            }
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }
</script>
</body>
</html>
